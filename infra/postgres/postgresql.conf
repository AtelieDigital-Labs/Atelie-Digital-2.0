# ----------------------------------------
# 1. LOGS
# ----------------------------------------

# Gera logs em formato JSON
log_destination = 'jsonlog'

# Necessário para gravar em arquivos
logging_collector = on

# Diretório relativo ao PGDATA
log_directory = 'log'

# Um arquivo por hora
log_filename = 'postgresql-%Y-%m-%d_%H00.json'

# Rotação a cada hora
log_rotation_age = 1h

# Nunca rotaciona por tamanho
log_rotation_size = 0

# Sobrescreve caso o nome se repita
log_truncate_on_rotation = on

# O que registrar
log_statement = 'all'
log_connections = off
log_disconnections = off

# Queries lentas
log_min_duration_statement = 500

# Apenas comandos que gerarem erro
log_min_error_statement = error

log_min_messages = warning

# Autovacuum
log_autovacuum_min_duration = 5000

# Prefixo (não é usado pelo jsonlog, mas não faz mal manter)
log_line_prefix = '%m [%p] %q%u@%d '

# ----------------------------------------
# MÉTRICAS
# ----------------------------------------

shared_preload_libraries = 'pg_stat_statements'

pg_stat_statements.track = all
pg_stat_statements.track_utility = on

track_activities = on
track_counts = on
track_io_timing = on
track_activity_query_size = 1024

# ----------------------------------------
# MANUTENÇÃO
# ----------------------------------------

autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

listen_addresses = '*'
port = 5432