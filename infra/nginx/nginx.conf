events {}

http {

    upstream atelie_account_api {
        server app:8000;
    }

    upstream atelie_catalog_api {
        server catalog_api:8000;
    }

    # upstream atelie_order_api {
    #     server orders:8000;
    # }

    upstream atelie_frontend {
        server frontend:80;
    }

    server {

        listen 80;

        location /api/v1/accounts/ {

            proxy_pass http://atelie_account_api;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location /api/v1/catalog/ {

            proxy_pass http://atelie_catalog_api;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        location / {

            proxy_pass http://atelie_frontend/;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # location /api/orders/ {

        #     proxy_pass http://orders/;

        #     proxy_set_header Host $host;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        # }
    }
}